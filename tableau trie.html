<script>
    
const age = { "a": 56, "b": 33, "c": 3, "d": 16, "e": 15 };
    function TrieTableau(obj){
        let keys=object.keys(obj);
        for(let i=0;i<keys.length;i++){
            for(let j=i+1;j<keys.length;j++)
               if(obj[keys[i]]>obj[keys[j]]){
                  let n=keys[i];
                  keys[i]=keys[j];
                  keys[j]=n;
               }
        }
        let result ={};
        for(let k=0;k<keys.length;k++){
            result[keys[k]] =obj[keys[k]];
        }
        return result;
    }
    result =TrieTableau(age);
    console.log(result);
</script>
