<script>
    function TroveObjet(tab,cle,valeur){
        for(let i=0;i<tab.length;i++){
            if(tab[i][cle]===valeur){
               return true;
            }
            else
               return false;
        }
    }

        {nom:"salma" ,age:20},
        {nom:"ahmed" ,age:23}
    ];
