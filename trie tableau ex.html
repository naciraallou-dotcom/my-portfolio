<script>
    let tab = [29, 10, 14, 37, 13];
for (let i = 0; i < tab.length - 1; i++) {
let minIndex = i;
for (let j = i + 1; j < tab.length; j++) {
if (tab[j] < tab[minIndex]) {
minIndex = j;
}
}
let temp = tab[i];
tab[i] = tab[minIndex];
tab[minIndex] = temp;
}
console.log(tab);
</script>
