<script>
    function trierParValeur(obj) {
  // Étape 1 : Transformer l'objet en tableau [clé, valeur]
  let entries = [];
  for (let key in obj) {
    entries.push([key, obj[key]]);
  }
  console.log("Étape 1 - Tableau non trié :", entries);

  // Étape 2 : Trier manuellement avec for (tri à bulles)
  for (let i = 0; i < entries.length - 1; i++) {
    for (let j = 0; j < entries.length - i - 1; j++) {
      if (entries[j][1] > entries[j + 1][1]) {
        let temp = entries[j];
        entries[j] = entries[j + 1];
        entries[j + 1] = temp;
      }
    }
  }
  console.log("Étape 2 - Tableau trié :", entries);

  // Étape 3 : Reconstruire l'objet trié
  let objTrie = {};
  for (let i = 0; i < entries.length; i++) {
    objTrie[entries[i][0]] = entries[i][1];
  }
  console.log("Étape 3 - Objet trié :", objTrie);

  return objTrie;
}

// Test
let data = { a: 56, b: 33, c: 3, d: 16, e: 15 };
trierParValeur(data);


</script>
