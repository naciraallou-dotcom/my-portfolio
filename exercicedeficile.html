<script>
    function trierTableau(obj) {
  // 1. Transformer en tableau
  let entries = Object.entries(obj);
    console.log("Étape 2 Tableau trié :",entries);
  let objTrie = {};
  for (let i = 0; i < entries.length; i++) {
    objTrie[entries[i][0]] = entries[i][1];
  }
  console.log("Étape 1 Tableau initial :", entries);
   for (let i = 0; i < entries.length - 1; i++) {
    for (let j = 0; j < entries.length - i - 1; j++) {
      if (entries[j][1] > entries[j + 1][1]) {
        // Échange
        let temp = entries[j];
       entries[j] = entries[j + 1];
       entries[j + 1] = temp;
      }
    }
  }
  

  return objTrie;
}
let age = { a: 56, b: 33, c: 3, d: 16, e: 15 };
let resultat = trierTableau(age);
console.log(resultat);


</script>
