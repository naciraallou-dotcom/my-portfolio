<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
  
   
<body>
    <div id="firstid"></div>
    <div class="myclass">div1</div>
    <div class="myclass">div2</div>
    <div class="myclass">div3</div>
    <div class="myclass">div4</div>
    <a href="£" class="myclass"></a>
    <p>first paragraph</p>
    <p>secend paragraph</p>
  <script>
    let myelement = document.getElementById("firstid");
    myelement.textContent ="hello everybody";
    let mydiv = document.getElementsByTagName("p");
    console.log(" the Number of Element : "+mydiv.length);
   
    let i=0;
    while(i<mydiv.length){
        mydiv[i].textContent += "hello dom" +(i+1);
        i++;
    }
    let myclass = document.getElementsByClassName("myclass");
    console.log(myclass.length);
    let j=0;
    do{
        myclass[j].innerHTML += "don't forget subscribe" +(j+1);
        j++;
    }while(j<myclass.length);
       
  </script>
</body>
</html>
