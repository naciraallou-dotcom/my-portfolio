    <ul id="liste">
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ul><script>
  const ul = document.getElementById("liste");

  // récupérer le dernier <li>
  const dernierLi = ul.lastElementChild;

  // le placer en première position
  ul.insertBefore(dernierLi, ul.firstElementChild);
</script>
